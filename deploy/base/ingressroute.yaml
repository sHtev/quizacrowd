# Public routes on {tenant}.{BASE_DOMAIN}. /admin is deliberately not routed: tenants are created
# through a port-forward. Overlays replace the host pattern in each match.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: quizacrowd
spec:
  entryPoints: [web]
  routes:
    - match: HostRegexp(`^[a-z0-9-]+\.quizacrowd\.example$`) && Path(`/ws`)
      kind: Rule
      services:
        - name: gateway
          port: 8080
    - match: HostRegexp(`^[a-z0-9-]+\.quizacrowd\.example$`) && Path(`/answers`)
      kind: Rule
      services:
        - name: ingest
          port: 8080
    - match: HostRegexp(`^[a-z0-9-]+\.quizacrowd\.example$`) && PathPrefix(`/api/`)
      kind: Rule
      services:
        - name: quiz-api
          port: 8080

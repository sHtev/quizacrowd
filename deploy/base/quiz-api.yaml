apiVersion: v1
kind: Service
metadata:
  name: quiz-api
spec:
  selector:
    app: quiz-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-api
  template:
    metadata:
      labels:
        app: quiz-api
    spec:
      containers:
        - name: quiz-api
          image: ghcr.io/shtev/quizacrowd-quiz-api
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: quizacrowd-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: quizacrowd-secrets, key: DATABASE_PASSWORD }
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef: { name: quizacrowd-secrets, key: ADMIN_TOKEN }
            - name: JOIN_TOKEN_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: quizacrowd-secrets, key: JOIN_TOKEN_PRIVATE_KEY }
          lifecycle:
            preStop: # keep serving while Traefik drops this pod from its routes, then shut down
              sleep: { seconds: 5 }
          ports:
            - containerPort: 8080
          startupProbe: # the JVM takes a few seconds; allow up to a minute
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { memory: 128Mi }
            limits: { memory: 384Mi }

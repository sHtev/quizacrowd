# Stateful backing services: Postgres, Valkey, Redpanda (ArgoCD app "platform").
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: quizacrowd
labels:
  - pairs:
      app.kubernetes.io/part-of: quizacrowd
resources:
  - namespace.yaml
  - postgres.yaml
  - valkey.yaml
  - redpanda.yaml

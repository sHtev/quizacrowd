# Hetzner: the four services (ArgoCD app "quizacrowd"). CI sets the image tags below on every main build.
# Tenants are {tenant}.quizacrowd.online, through Cloudflare, which reaches Traefik over HTTPS with the
# Cloudflare origin certificate (Secret origin-tls, loaded by scripts/origin-tls.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/services
- redirect.yaml
images:
- name: ghcr.io/shtev/quizacrowd-gateway
  newName: ghcr.io/shtev/quizacrowd-gateway
  newTag: 0c84967
- name: ghcr.io/shtev/quizacrowd-ingest
  newName: ghcr.io/shtev/quizacrowd-ingest
  newTag: 0c84967
- name: ghcr.io/shtev/quizacrowd-quiz-api
  newName: ghcr.io/shtev/quizacrowd-quiz-api
  newTag: 0c84967
- name: ghcr.io/shtev/quizacrowd-scorer
  newName: ghcr.io/shtev/quizacrowd-scorer
  newTag: 0c84967
patches:
- target:
    kind: ConfigMap
    name: quizacrowd-config
  patch: |
    - op: replace
      path: /data/BASE_DOMAIN
      value: quizacrowd.online
- target:
    kind: IngressRoute
    name: quizacrowd
  patch: |
    - op: replace
      path: /spec/entryPoints
      value: [websecure]
    - op: add
      path: /spec/tls
      value: { secretName: origin-tls }
    - op: replace
      path: /spec/routes/0/match
      value: HostRegexp(`^[a-z0-9-]+\.quizacrowd\.online$`) && Path(`/ws`)
    - op: replace
      path: /spec/routes/1/match
      value: HostRegexp(`^[a-z0-9-]+\.quizacrowd\.online$`) && Path(`/answers`)
    - op: replace
      path: /spec/routes/2/match
      value: HostRegexp(`^[a-z0-9-]+\.quizacrowd\.online$`) && (PathPrefix(`/api/`) || PathPrefix(`/assets/`) || Path(`/play`) || Path(`/host`) || Path(`/screen`))

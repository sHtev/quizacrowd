# Hetzner: the four services (ArgoCD app "quizacrowd"). CI sets the image tags below on every main build.
# Until the real domain exists (Task 13), tenants are {tenant}.2.31.145.13.sslip.io over plain HTTP.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base/services
images:
- name: ghcr.io/shtev/quizacrowd-gateway
  newName: ghcr.io/shtev/quizacrowd-gateway
  newTag: 744bbf3
- name: ghcr.io/shtev/quizacrowd-ingest
  newName: ghcr.io/shtev/quizacrowd-ingest
  newTag: 744bbf3
- name: ghcr.io/shtev/quizacrowd-quiz-api
  newName: ghcr.io/shtev/quizacrowd-quiz-api
  newTag: 744bbf3
- name: ghcr.io/shtev/quizacrowd-scorer
  newName: ghcr.io/shtev/quizacrowd-scorer
  newTag: 744bbf3
patches:
- patch: |
    - op: replace
      path: /data/BASE_DOMAIN
      value: 2.31.145.13.sslip.io
  target:
    kind: ConfigMap
    name: quizacrowd-config
- patch: |
    - op: replace
      path: /spec/routes/0/match
      value: HostRegexp(`^[a-z0-9-]+\.2\.31\.145\.13\.sslip\.io$`) && Path(`/ws`)
    - op: replace
      path: /spec/routes/1/match
      value: HostRegexp(`^[a-z0-9-]+\.2\.31\.145\.13\.sslip\.io$`) && Path(`/answers`)
    - op: replace
      path: /spec/routes/2/match
      value: HostRegexp(`^[a-z0-9-]+\.2\.31\.145\.13\.sslip\.io$`) && (PathPrefix(`/api/`) || PathPrefix(`/assets/`) || Path(`/play`) || Path(`/host`) || Path(`/screen`))
  target:
    kind: IngressRoute
    name: quizacrowd

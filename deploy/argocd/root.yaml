# App of apps: Argo CD watches deploy/argocd and creates the apps defined there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sHtev/quizacrowd.git
    targetRevision: main
    path: deploy/argocd
    directory:
      include: "{platform.yaml,quizacrowd.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # Unit and integration tests; Testcontainers uses the runner's Docker.
      - run: ./gradlew build

  publish:
    # Images for every main commit, tagged with the short SHA; then the Hetzner overlay is pointed at them
    # and ArgoCD rolls them out.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: write # the deploy-tag commit
      packages: write # GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Push images
        id: images
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(git rev-parse --short HEAD)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          ./gradlew jib -PimageTag="$tag" \
            -Djib.to.auth.username="$GHCR_USER" -Djib.to.auth.password="$GHCR_TOKEN"

      - name: Point the Hetzner overlay at the new images
        env:
          TAG: ${{ steps.images.outputs.tag }}
        run: |
          overlay=deploy/overlays/hetzner
          if [ ! -d "$overlay" ]; then
            echo "No $overlay yet; nothing to bump."
            exit 0
          fi
          cd "$overlay"
          for service in quiz-api ingest scorer gateway; do
            kustomize edit set image "ghcr.io/shtev/quizacrowd-$service=ghcr.io/shtev/quizacrowd-$service:$TAG"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): images $TAG [skip ci]"
          git push
